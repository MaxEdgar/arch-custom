# ═══════════════════════════════════════════════════════════════════
# Arch Custom — Default Configuration
# These values are used as defaults in the installer.
# ═══════════════════════════════════════════════════════════════════

# ── System ────────────────────────────────────────────────────────
DEFAULT_LOCALE="en_US.UTF-8"
DEFAULT_TIMEZONE="UTC"
DEFAULT_HOSTNAME="arch"
DEFAULT_KEYBOARD="us"

# ── Disk ──────────────────────────────────────────────────────────
DEFAULT_FILESYSTEM="ext4"
DEFAULT_SWAP_TYPE="swapfile"
DEFAULT_SWAP_SIZE_MB=2048
DEFAULT_PARTITION_MODE="auto-uefi"

# ── Boot ──────────────────────────────────────────────────────────
DEFAULT_BOOTLOADER="grub-systemd"
DEFAULT_KERNEL="linux"

# ── Software ──────────────────────────────────────────────────────
DEFAULT_NETWORK="NetworkManager"
DEFAULT_AUDIO="pipewire"
DEFAULT_GPU="modesetting"

# ── Build ─────────────────────────────────────────────────────────
ISO_VERSION="1.0.0"
ISO_NAME="arch-custom"
BUILD_DATE=$(date +%Y.%m.%d)

# ── ISO Size Limits ──────────────────────────────────────────────
MIN_ISO_SIZE_MB=200
MAX_ISO_SIZE_MB=1024

# ── Performance Targets ──────────────────────────────────────────
TARGET_BOOT_TIME_S=5
TARGET_IDLE_RAM_MB=300
TARGET_SHELL_STARTUP_MS=100
