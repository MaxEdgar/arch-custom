# ═══════════════════════════════════════════════════════════════════
# Arch Custom ISO — GitHub Actions Build Workflow
# Builds a minimal, fast Arch Linux ISO using an Arch Linux container.
# ═══════════════════════════════════════════════════════════════════
name: Build Arch Custom ISO

on:
  push:
    branches: [main]
    paths:
      - 'archiso/**'
      - '.github/workflows/build-iso.yml'
      - 'installer/**'
      - 'cli/**'
      - 'config/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: iso-build-${{ github.ref }}
  cancel-in-progress: true

env:
  ISO_NAME: arch-custom

jobs:
  build:
    name: 🔨 Build ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      actions: read

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── 2. System Info ────────────────────────────────────────
      - name: 📊 System info
        run: |
          echo "═══ Runner ═══"
          echo "CPU: $(nproc) cores"
          echo "RAM: $(free -h | awk '/Mem:/ {print $2}')"
          echo "Disk: $(df -h / | awk 'NR==2 {print $4}') free"

      # ── 3. Build ISO inside Arch Linux container ─────────────
      - name: 🏗️ Build ISO in Arch Linux container
        id: build
        run: |
          set -euo pipefail

          BUILD_START=$(date +%s)
          echo "Starting build at $(date)"

          # Run entire build inside an Arch Linux container
          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/out:/out" \
            archlinux:latest \
            bash -c '
              set -euo pipefail

              echo "═══ Container System Info ═══"
              cat /etc/os-release | head -3
              echo "Arch: $(uname -m)"
              echo ""

              # Update and install dependencies
              echo "Installing dependencies..."
              pacman -Syu --noconfirm \
                archiso \
                arch-install-scripts \
                dosfstools \
                e2fsprogs \
                mtools \
                sed \
                gzip \
                xz \
                zstd \
                squashfs-tools \
                libarchive \
                pacman-contrib \
                git

              echo "Dependencies installed."

              # Setup build directory
              WORKDIR=/build
              mkdir -p "$WORKDIR/work" "$WORKDIR/out"

              # Use the installed archiso
              # mkarchiso is at /usr/bin/mkarchiso

              # Copy our profile
              echo "Copying profile..."
              cp -r /src/archiso "$WORKDIR/profile"

              # Ensure scripts are executable
              chmod -R +x "$WORKDIR/profile/airootfs/usr/bin/" 2>/dev/null || true
              chmod -R +x "$WORKDIR/profile/airootfs/usr/share/" 2>/dev/null || true
              chmod -R +x "$WORKDIR/profile/airootfs/usr/lib/" 2>/dev/null || true

              echo "Profile structure:"
              find "$WORKDIR/profile" -type f | head -50

              # Build the ISO
              echo ""
              echo "═══ Building ISO ═══"
              
              mkarchiso -v \
                -w "$WORKDIR/work" \
                -o "$WORKDIR/out" \
                "$WORKDIR/profile"

              # Copy output
              cp "$WORKDIR/out/"*.iso /out/ 2>/dev/null || true
              cp "$WORKDIR/out/"*.sha256 /out/ 2>/dev/null || true

              echo ""
              echo "═══ Build Complete ═══"
              ls -lh /out/*.iso 2>/dev/null || echo "No ISO found!"
            '

          BUILD_END=$(date +%s)
          BUILD_TIME=$((BUILD_END - BUILD_START))
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "Build completed in ${BUILD_TIME} seconds"

      # ── 4. Find and rename ISO ────────────────────────────────
      - name: 📋 Process ISO
        id: validate
        run: |
          set -euo pipefail

          ISO_FILE=$(ls out/*.iso 2>/dev/null | head -1)
          if [[ -z "$ISO_FILE" ]]; then
            echo "❌ No ISO file found!"
            exit 1
          fi

          # Rename to consistent name
          FINAL_NAME="arch-custom-${{ github.run_number }}-x86_64.iso"
          mv "$ISO_FILE" "out/$FINAL_NAME"
          ISO_FILE="out/$FINAL_NAME"

          echo "ISO: $FINAL_NAME"

          # Generate checksums
          cd out
          sha256sum "$FINAL_NAME" > "${FINAL_NAME}.sha256"
          sha512sum "$FINAL_NAME" > "${FINAL_NAME}.sha512"

          # Get info
          ISO_SIZE=$(du -h "$FINAL_NAME" | cut -f1)
          SHA256=$(sha256sum "$FINAL_NAME" | cut -d' ' -f1)

          echo "iso_name=$FINAL_NAME" >> "$GITHUB_OUTPUT"
          echo "iso_size=$ISO_SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          echo ""
          echo "═══ ISO Details ═══"
          echo "File:    $FINAL_NAME"
          echo "Size:    $ISO_SIZE"
          echo "SHA256:  $SHA256"
          echo "═══════════════════"

          # Validate
          FILE_TYPE=$(file "$ISO_FILE")
          echo "Type: $FILE_TYPE"

          ISO_BYTES=$(stat -c%s "$ISO_FILE")
          if ((ISO_BYTES < 52428800)); then
            echo "⚠️  ISO smaller than 50MB — may be incomplete"
          fi
          echo "✅ ISO validation passed"

      # ── 5. Create manifest ────────────────────────────────────
      - name: 📄 Build manifest
        run: |
          cd out
          cat > build-manifest.json << EOF
          {
            "iso_name": "${{ steps.validate.outputs.iso_name }}",
            "iso_size": "${{ steps.validate.outputs.iso_size }}",
            "sha256": "${{ steps.validate.outputs.sha256 }}",
            "build_time_seconds": "${{ steps.build.outputs.build_time }}",
            "commit": "${{ github.sha }}",
            "run_number": "${{ github.run_number }}",
            "arch": "x86_64",
            "build_date": "$(date -Iseconds)"
          }
          EOF

      # ── 6. Upload ISO artifact ────────────────────────────────
      - name: 📤 Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: arch-custom-iso-${{ github.run_number }}
          path: |
            out/*.iso
            out/*.sha256
            out/*.sha512
            out/build-manifest.json
          retention-days: 7
          compression-level: 0

      # ── 7. Upload logs ────────────────────────────────────────
      - name: 📋 Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs-${{ github.run_number }}
          path: out/*.log
          retention-days: 3

      # ── 8. Summary ────────────────────────────────────────────
      - name: 📊 Summary
        if: always()
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║         ARCH CUSTOM ISO BUILD RESULT         ║"
          echo "╚══════════════════════════════════════════════╝"
          echo ""
          echo "  Status:     ${{ job.status }}"
          echo "  ISO:        ${{ steps.validate.outputs.iso_name }}"
          echo "  Size:       ${{ steps.validate.outputs.iso_size }}"
          echo "  SHA256:     ${{ steps.validate.outputs.sha256 }}"
          echo "  Build Time: ${{ steps.build.outputs.build_time }}s"
          echo "  Commit:     ${{ github.sha }}"
          echo "  Run:        #${{ github.run_number }}"
          echo ""
          echo "  Download:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
