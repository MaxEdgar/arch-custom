# Arch Custom — GRUB Configuration for ISO
# Minimal, fast boot configuration.

set default=0
set timeout=3
set gfxpayload=keep

# Load themes if available
# insmod all_video

menuentry "Arch Custom (x86_64)" {
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archiso_arch=x86_64
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry "Arch Custom (x86_64) — NVIDIA" {
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archiso_arch=x86_64 nvidia-drm.modeset=1
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry "Arch Custom (x86_64) — Fallback" {
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archiso_arch=x86_64
    initrd /arch/boot/x86_64/initramfs-linux-fallback.img
}

menuentry "Memtest86+" {
    linux /boot/memtest86+/memtest.bin
}
