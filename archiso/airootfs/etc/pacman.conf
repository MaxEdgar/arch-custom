#
# /etc/pacman.conf — Arch Custom ISO Pacman Configuration
#

[options]
RootDir          = /
CacheDir         = /var/cache/pacman/pkg
GPGDir           = /etc/pacman.d/gnupg
HookDir          = /etc/pacman.d/hooks
SigLevel         = Required DatabaseOptional
LocalFileSigLevel = Optional

# ── Performance ───────────────────────────────────────────────────
ParallelDownloads = 10
ILoveCandy
Color
CheckSpace
VerbosePkgLists
UseSyslog
# Use parallel compression
Architecture = auto

# ── Repositories ──────────────────────────────────────────────────
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Enable this for multilib support (32-bit packages)
#[multilib]
#Include = /etc/pacman.d/mirrorlist
