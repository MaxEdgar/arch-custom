#
# /etc/pacman.conf — Arch Custom ISO Pacman Configuration
# Optimized for fast, reliable package operations.
#

[options]
RootDir          = /
CacheDir         = /var/cache/pacman/pkg
GPGDir           = /etc/pacman.d/gnupg
HookDir          = /etc/pacman.d/hooks
SigLevel         = Required DatabaseOptional
LocalFileSigLevel = Optional

# ── Performance ───────────────────────────────────────────────────
# Parallel downloads: use up to 10 connections
# On low-end hardware (< 2 cores), reduce to 3-5
ParallelDownloads = 10

# Show colored output
Color

# Show package names in bold
ILoveCandy

# Verify disk space before install
CheckSpace

# Show verbose package lists
VerbosePkgLists

# Log to syslog
UseSyslog

# Architecture
Architecture = auto

# Download timeout (seconds)
Timeout = 15

# ── Repositories ──────────────────────────────────────────────────
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Enable this for multilib support (32-bit packages, e.g., Steam, Wine)
#[multilib]
#Include = /etc/pacman.d/mirrorlist
