# Arch Custom — Power Button & Lid Configuration
# Default: power button turns display off (not shutdown)
# Lid: suspend

[Login]
# Power button action:
# ignore, poweroff, reboot, halt, suspend, hibernate, hybrid-sleep, lock, kexec
# Default to "lock" then "display-off" via HandlePowerKeyLongPress
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=suspend
HandleHibernateKey=hibernate
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore

# Idle action
IdleAction=suspend
IdleActionSec=30min

# Reboot key
HandleRebootKey=reboot
HandleRebootKeyLongPress=kexec
